plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.selflearn'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.selflearn"
        minSdk 21          // Android 5.0+ — covers essentially all low-end 1GB RAM phones
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    // Intentionally minimal — no ML/AI libraries. The whole engine is plain Kotlin
    // in SelfLearningEngine.kt, so there's no extra runtime memory overhead.
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
